AWSTemplateFormatVersion: "2010-09-09"
Description: Static AWS Amplify Hosting, native custom domain, and GitHub OIDC access for diloreto.com

Parameters:
  EnableAmplifyDomain:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create the native Amplify domain association only after candidate-domain validation and the approval-gated cutover steps.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
    Description: Existing GitHub Actions OIDC provider ARN. Leave empty to create it in this stack.
  BranchName:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  DomainName:
    Type: String
    Default: diloreto.com
    AllowedPattern: "^(?!-)[A-Za-z0-9.-]+[A-Za-z0-9]$"
  DeploymentRoleName:
    Type: String
    Default: diloreto-website-github-deploy
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]+$"

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  CreateAmplifyDomain: !Equals [!Ref EnableAmplifyDomain, "true"]

Resources:
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: diloreto-website
      Description: Static site for diloreto.com, deployed by GitHub Actions and served directly by Amplify Hosting.
      Platform: WEB
      EnableBranchAutoDeletion: false
      CustomRules:
        - Source: !Sub "https://www.${DomainName}"
          Target: !Sub "https://${DomainName}"
          Status: "301"
        - Source: !Sub "https://paul.${DomainName}"
          Target: https://pauldiloreto.com
          Status: "301"
        - Source: /<*>
          Target: /404.html
          Status: "404"
      CustomHeaders: |
        customHeaders:
          - pattern: '**'
            headers:
              - key: 'Strict-Transport-Security'
                value: 'max-age=63072000; includeSubDomains'
              - key: 'X-Content-Type-Options'
                value: 'nosniff'
              - key: 'X-Frame-Options'
                value: 'DENY'
              - key: 'Referrer-Policy'
                value: 'strict-origin-when-cross-origin'
              - key: 'Permissions-Policy'
                value: 'camera=(), geolocation=(), microphone=()'
          - pattern: '**/*.html'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/areyou*'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/assets/*'
            headers:
              - key: 'Cache-Control'
                value: 'public, max-age=31536000, immutable'
          - pattern: '/robots.txt'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/favicon.png'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/apple-touch-icon.png'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
          - pattern: '/release.json'
            headers:
              - key: 'Cache-Control'
                value: 'no-cache, no-store, must-revalidate'
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref BranchName
      Description: Production branch populated by GitHub Actions manual deployments.
      Stage: PRODUCTION
      EnableAutoBuild: false
      EnablePerformanceMode: false
      EnablePullRequestPreview: false
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  AmplifyDomain:
    Type: AWS::Amplify::Domain
    Condition: CreateAmplifyDomain
    DependsOn:
      - AmplifyBranch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      DomainName: !Ref DomainName
      EnableAutoSubDomain: false
      SubDomainSettings:
        - Prefix: ""
          BranchName: !Ref BranchName
        - Prefix: www
          BranchName: !Ref BranchName
        - Prefix: paul
          BranchName: !Ref BranchName

  GitHubOidcProvider:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref DeploymentRoleName
      Description: Publishes validated static artifacts to the diloreto-website Amplify main branch.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:soodoh@18269267/websites@1358469291:environment:production-diloreto
      Policies:
        - PolicyName: PublishAmplifyArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource: !Sub "${AmplifyBranch.Arn}/deployments/*"
              - Effect: Allow
                Action: amplify:GetJob
                Resource: !Sub "${AmplifyBranch.Arn}/jobs/*"
      Tags:
        - Key: Project
          Value: diloreto-website
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  AmplifyAppId:
    Description: Amplify application ID.
    Value: !GetAtt AmplifyApp.AppId
  AmplifyAppArn:
    Description: Amplify application ARN.
    Value: !GetAtt AmplifyApp.Arn
  AmplifyDefaultDomain:
    Description: Amplify-generated application domain.
    Value: !GetAtt AmplifyApp.DefaultDomain
  AmplifyBranchName:
    Description: Production Amplify branch name.
    Value: !GetAtt AmplifyBranch.BranchName
  AmplifyBranchArn:
    Description: Production Amplify branch ARN.
    Value: !GetAtt AmplifyBranch.Arn
  AmplifyBranchUrl:
    Description: Default production branch URL used for pre-cutover validation.
    Value: !Sub "https://${AmplifyBranch.BranchName}.${AmplifyApp.DefaultDomain}"
  AmplifyDomainArn:
    Condition: CreateAmplifyDomain
    Description: Native Amplify domain association ARN.
    Value: !GetAtt AmplifyDomain.Arn
  AmplifyCertificateRecord:
    Condition: CreateAmplifyDomain
    Description: Amplify-managed certificate validation DNS record.
    Value: !GetAtt AmplifyDomain.CertificateRecord
  GitHubDeploymentRoleArn:
    Description: IAM role assumed by the GitHub production environment through OIDC.
    Value: !GetAtt GitHubDeploymentRole.Arn
  GitHubOidcProviderArn:
    Description: GitHub Actions OIDC provider created or reused by this stack.
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
  ProductionUrl:
    Condition: CreateAmplifyDomain
    Description: Canonical production URL.
    Value: !Sub "https://${DomainName}"
  PaulRedirectUrl:
    Condition: CreateAmplifyDomain
    Description: Legacy Paul hostname redirected by Amplify Hosting.
    Value: !Sub "https://paul.${DomainName}"

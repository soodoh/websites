AWSTemplateFormatVersion: "2010-09-09"
Description: Production AWS Amplify Hosting, IAM, deployment role, and monitoring for sarabeth-studio.

Parameters:
  GitHubOwner:
    Type: String
    Default: soodoh
  GitHubRepository:
    Type: String
    Default: websites
  GitHubBranch:
    Type: String
    Default: main
  GitHubOidcProviderArn:
    Type: String
    Description: ARN output from the bootstrap stack.
  WorkloadPermissionsBoundaryArn:
    Type: String
    Description: Workload-role boundary ARN output from the bootstrap stack.
  GitHubAccessTokenSecretArn:
    Type: String
    NoEcho: true
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:sarabeth-amplify-github-[A-Za-z0-9/_+=.@-]+$"
    Description: Temporary Secrets Manager ARN named sarabeth-amplify-github-* containing a token field, used only when creating a replacement Amplify GitHub App connection.
  OperationalAlarmTopicArn:
    Type: String
    AllowedPattern: "^arn:[^:]+:sns:[^:]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    Description: SNS topic ARN output from the account-foundation stack.
  ContentfulSpaceId:
    Type: String
    MinLength: 1
    Description: Non-secret Contentful space identifier used during production builds.
Conditions:
  HasGitHubAccessToken: !Not [!Equals [!Ref GitHubAccessTokenSecretArn, ""]]

Resources:
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: sarabeth-amplify-service
      Description: Allows Amplify builds to read the Contentful SSM parameter and deliver SSR logs.
      PermissionsBoundary: !Ref WorkloadPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ContentfulBuildParameterAndSsrLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadContentfulBuildParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarabeth-studio/production/contentful/access-token
              - Sid: VerifyAmplifyBuildSource
                Effect: Allow
                Action: amplify:GetJob
                Resource: !Sub arn:${AWS::Partition}:amplify:${AWS::Region}:${AWS::AccountId}:apps/*/branches/*/jobs/*
              - Sid: DescribeAmplifyLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: CreateAmplifyLogGroups
                Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/amplify/*
              - Sid: WriteAmplifyLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/amplify/*:log-stream:*

  EmailRateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: sarabeth-contact-email-rate-limit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: window
          AttributeType: S
      KeySchema:
        - AttributeName: window
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  AmplifyComputeRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: sarabeth-amplify-compute-main
      Description: Least-privilege contact email and YouTube playlist access for the production Amplify compute branch.
      PermissionsBoundary: !Ref WorkloadPermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub ${AmplifyApp.Arn}/branches/${GitHubBranch}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ProductionRuntimeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendContactEmail
                Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/sarabethbelon.com
                Condition:
                  StringEquals:
                    ses:FromAddress: contact@sarabethbelon.com
                  ForAllValues:StringEquals:
                    ses:Recipients: sarabethstudio@gmail.com
              - Sid: UpdateContactEmailRateLimit
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt EmailRateLimitTable.Arn
              - Sid: ReadYouTubeApiKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/sarabeth-studio/production/youtube/api-key

  AmplifyApp:
    Type: AWS::Amplify::App
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: sarabeth-studio-production
      Description: Production TanStack Start application for sarabethbelon.com.
      Repository: !Sub https://github.com/${GitHubOwner}/${GitHubRepository}
      AccessToken: !If
        - HasGitHubAccessToken
        - !Sub "{{resolve:secretsmanager:${GitHubAccessTokenSecretArn}:SecretString:token}}"
        - !Ref AWS::NoValue
      Platform: WEB_COMPUTE
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn
      EnableBranchAutoDeletion: false
      CustomHeaders: |
        customHeaders:
          - pattern: "**/*"
            headers:
              - key: "Strict-Transport-Security"
                value: "max-age=63072000; includeSubDomains"
              - key: "X-Content-Type-Options"
                value: "nosniff"
              - key: "Referrer-Policy"
                value: "strict-origin-when-cross-origin"
              - key: "X-Frame-Options"
                value: "DENY"
              - key: "Permissions-Policy"
                value: "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
          - pattern: "**/*.html"
            headers:
              - key: "Cache-Control"
                value: "no-cache, no-store, must-revalidate"
          - pattern: "/"
            headers:
              - key: "Cache-Control"
                value: "no-cache, no-store, must-revalidate"
          - pattern: "/assets/*"
            headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
          - pattern: "/__tsr/staticServerFnCache/*"
            headers:
              - key: "Cache-Control"
                value: "public, max-age=31536000, immutable"
          - pattern: "/__deployment.json"
            headers:
              - key: "Cache-Control"
                value: "no-cache, no-store, must-revalidate"
      CustomRules:
        - Source: https://www.sarabethbelon.com
          Target: https://sarabethbelon.com
          Status: "301"
        - Source: /about
          Target: /about.html
          Status: "200"
        - Source: /contact
          Target: /contact.html
          Status: "200"
        - Source: /engagements
          Target: /engagements.html
          Status: "200"
        - Source: /lessons
          Target: /lessons.html
          Status: "200"
        - Source: /media
          Target: /media.html
          Status: "200"
        - Source: /privacy
          Target: /privacy.html
          Status: "200"
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  MainBranch:
    Type: AWS::Amplify::Branch
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref GitHubBranch
      Description: Production branch; releases are started only after GitHub Actions CI succeeds.
      ComputeRoleArn: !GetAtt AmplifyComputeRole.Arn
      EnableAutoBuild: false
      EnablePerformanceMode: false
      EnablePullRequestPreview: false
      EnableSkewProtection: false
      Framework: TanStack Start
      Stage: PRODUCTION
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: apps/sarabeth
        - Name: CONTENTFUL_SPACE_ID
          Value: !Ref ContentfulSpaceId
        - Name: CONTENTFUL_ACCESS_TOKEN_PARAMETER
          Value: /sarabeth-studio/production/contentful/access-token
        - Name: YOUTUBE_API_KEY_PARAMETER
          Value: /sarabeth-studio/production/youtube/api-key
        - Name: EMAIL_RATE_LIMIT_TABLE
          Value: !Ref EmailRateLimitTable
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  ContentfulOpenTofuStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: websites-sarabeth-contentful-tofu-state-015989770400-us-west-2
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  ContentfulOpenTofuStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ContentfulOpenTofuStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ContentfulOpenTofuStateBucket.Arn
              - !Sub ${ContentfulOpenTofuStateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  AmplifyComputeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/amplify/${AmplifyApp.AppId}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  Amplify5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: sarabeth-amplify-production-5xx
      AlarmDescription: Amplify Hosting returned at least two 5xx responses in two of three five-minute periods.
      Namespace: AWS/AmplifyHosting
      MetricName: 5xxErrors
      Dimensions:
        - Name: App
          Value: !GetAtt AmplifyApp.AppId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarmTopicArn
      OKActions:
        - !Ref OperationalAlarmTopicArn
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  AmplifyLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AlarmName: sarabeth-amplify-production-latency
      AlarmDescription: Amplify Hosting average time to first byte exceeded five seconds twice.
      Namespace: AWS/AmplifyHosting
      MetricName: Latency
      Dimensions:
        - Name: App
          Value: !GetAtt AmplifyApp.AppId
      Statistic: Average
      Unit: Seconds
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarmTopicArn
      OKActions:
        - !Ref OperationalAlarmTopicArn
      Tags:
        - Key: Project
          Value: sarabeth-studio
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  RoutineDeploymentRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: sarabeth-amplify-deploy-main
      Description: GitHub Actions role restricted to production releases of this Amplify app.
      PermissionsBoundary: !Ref WorkloadPermissionsBoundaryArn
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:soodoh@18269267/websites@1358469291:environment:production-sarabeth
      Policies:
        - PolicyName: ReleaseSpecificAmplifyApp
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - amplify:GetBranch
                  - amplify:UpdateBranch
                Resource: !GetAtt MainBranch.Arn
              - Effect: Allow
                Action:
                  - amplify:GetJob
                  - amplify:StartJob
                Resource: !Sub ${MainBranch.Arn}/jobs/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ContentfulOpenTofuStateBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ContentfulOpenTofuStateBucket.Arn}/contentful/terraform.tfstate
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${ContentfulOpenTofuStateBucket.Arn}/contentful/terraform.tfstate.tflock

Outputs:
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
  AmplifyAppArn:
    Value: !GetAtt AmplifyApp.Arn
  AmplifyDefaultDomain:
    Value: !GetAtt AmplifyApp.DefaultDomain
  AmplifyBranchUrl:
    Value: !Sub https://${GitHubBranch}.${AmplifyApp.DefaultDomain}
  AmplifyServiceRoleArn:
    Value: !GetAtt AmplifyServiceRole.Arn
  AmplifyComputeRoleArn:
    Value: !GetAtt AmplifyComputeRole.Arn
  RoutineDeploymentRoleArn:
    Value: !GetAtt RoutineDeploymentRole.Arn
  ContentfulOpenTofuStateBucketName:
    Value: !Ref ContentfulOpenTofuStateBucket
  ComputeLogGroupName:
    Value: !Ref AmplifyComputeLogGroup

name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  root:
    name: root checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - run: bun run test:workspace && bash scripts/ci/lint.sh
        env:
          VERIFY_AMPLIFY_TOOLCHAIN: "1"
  sarabeth:
    uses: ./.github/workflows/_site-ci.yml
    with:
      site: sarabeth
  carolyn:
    uses: ./.github/workflows/_site-ci.yml
    with:
      site: carolyn
  paul:
    uses: ./.github/workflows/_site-ci.yml
    with:
      site: paul
  diloreto:
    uses: ./.github/workflows/_site-ci.yml
    with:
      site: diloreto
  gate:
    name: CI gate
    if: always()
    needs: [root, sarabeth, carolyn, paul, diloreto]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every check to pass
        env:
          ROOT_RESULT: ${{ needs.root.result }}
          SARABETH_RESULT: ${{ needs.sarabeth.result }}
          CAROLYN_RESULT: ${{ needs.carolyn.result }}
          PAUL_RESULT: ${{ needs.paul.result }}
          DILORETO_RESULT: ${{ needs.diloreto.result }}
        run: |
          test "$ROOT_RESULT" = success
          test "$SARABETH_RESULT" = success
          test "$CAROLYN_RESULT" = success
          test "$PAUL_RESULT" = success
          test "$DILORETO_RESULT" = success

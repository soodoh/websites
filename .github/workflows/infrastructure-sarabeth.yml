name: Sarabeth protected infrastructure (publication locked)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Separately approved operation; preparation never switches domain or webhook
        type: choice
        options: [legacy, prepare-monorepo, switch-monorepo]
        default: legacy
        required: true
      transition_confirmation:
        description: APPROVE_MONOREPO_PREPARATION or APPROVE_MONOREPO_SWITCH (separate from domain approval)
        type: string
      selected_commit:
        description: Exact independently verified monorepo candidate commit for switch
        type: string
      selected_job:
        description: Exact successful sarabeth-production candidate job for switch
        type: string
      retarget_webhook:
        description: Explicitly approved CMS webhook switch (never implied by domain switch)
        type: boolean
        default: false
      apply_domain:
        description: Apply the approval-gated Amplify domain association
        required: true
        default: false
        type: boolean
      rollback_to_netlify:
        description: Remove the Amplify domain association and restore Netlify web records
        required: true
        default: false
        type: boolean
      cutover_confirmation:
        description: Enter APPROVAL_GATE_1_CONFIRMED when apply_domain is true
        required: false
        type: string

permissions:
  contents: read

jobs:
  cloudformation:
    if: ${{ false }}
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: apps/sarabeth
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    environment: infrastructure-sarabeth
    concurrency:
      group: sarabeth-production
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MONOREPO_OPERATION: ${{ inputs.operation }}
      TRANSITION_CONFIRMATION: ${{ inputs.transition_confirmation }}
      APPLY_DOMAIN: ${{ inputs.apply_domain }}
      ROLLBACK_TO_NETLIFY: ${{ inputs.rollback_to_netlify }}
      RETARGET_WEBHOOK: ${{ inputs.retarget_webhook }}
      CUTOVER_CONFIRMATION: ${{ inputs.cutover_confirmation }}
      SELECTED_COMMIT: ${{ inputs.selected_commit }}
      SELECTED_JOB: ${{ inputs.selected_job }}
      MONOREPO_SUBJECT: ${{ vars.SARABETH_ROUTINE_OIDC_SUBJECT }}
      MONOREPO_STATE_OBJECT: ${{ vars.SARABETH_STATE_OBJECT_ARN }}
      AWS_REGION: us-west-2
      EXPECTED_AWS_ACCOUNT: "015989770400"
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
      OIDC_PROVIDER_ARN: ${{ vars.OIDC_PROVIDER_ARN }}
      WORKLOAD_PERMISSIONS_BOUNDARY_ARN: ${{ vars.WORKLOAD_PERMISSIONS_BOUNDARY_ARN }}
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      CONTENTFUL_SPACE_ID: ${{ vars.CONTENTFUL_SPACE_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up trusted Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Set up trusted Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Install trusted root smoke tools before credentials
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fail closed before infrastructure credentials
        env:
          PUBLICATION_UNLOCKED: ${{ vars.SARABETH_INFRASTRUCTURE_ACTIVATED }}
          EXPECTED_SUBJECT: ${{ vars.SARABETH_INFRASTRUCTURE_OIDC_SUBJECT }}
        run: |
          test "$GITHUB_REPOSITORY" = soodoh/websites
          test "$GITHUB_REF" = refs/heads/main
          test "$PUBLICATION_UNLOCKED" = true
          python3 ../../scripts/release/sarabeth_transition.py prepare
          python3 ../../scripts/release/oidc.py
      - name: Configure protected infrastructure credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.INFRASTRUCTURE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sarabeth-amplify-infrastructure
          role-duration-seconds: 14400
          allowed-account-ids: "015989770400"
          audience: sts.amazonaws.com
          unset-current-credentials: true

      - name: Verify production account
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$account" != "$EXPECTED_AWS_ACCOUNT" ]]; then
            echo "Refusing to mutate unexpected AWS account $account" >&2
            exit 1
          fi

      - name: Validate CloudFormation templates
        run: |
          for template in infrastructure/cloudformation/*.yaml; do
            aws cloudformation validate-template --template-body "file://$template" >/dev/null
          done

      - name: Verify domain operation
        env:
          CUTOVER_CONFIRMATION: ${{ inputs.cutover_confirmation }}
        run: |
          if [[ "${{ inputs.apply_domain }}" == "true" && "${{ inputs.rollback_to_netlify }}" == "true" ]]; then
            echo "apply_domain and rollback_to_netlify are mutually exclusive" >&2
            exit 1
          fi
          if [[ "${{ inputs.apply_domain }}" == "true" && "$CUTOVER_CONFIRMATION" != "APPROVAL_GATE_1_CONFIRMED" ]]; then
            echo "Domain association requires approval gate 1 confirmation" >&2
            exit 1
          fi

      - name: Verify selected monorepo candidate before infrastructure mutation
        if: inputs.operation == 'switch-monorepo'
        run: python3 ../../scripts/release/sarabeth_transition.py begin

      - name: Apply hosting stack
        if: inputs.rollback_to_netlify == false && inputs.operation != 'switch-monorepo'
        timeout-minutes: 30
        run: |
          mapfile -t hosting_parameters < "$RUNNER_TEMP/sarabeth-hosting-parameters"
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-hosting \
            --template-file infrastructure/cloudformation/hosting.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              GitHubOidcProviderArn="$OIDC_PROVIDER_ARN" \
              WorkloadPermissionsBoundaryArn="$WORKLOAD_PERMISSIONS_BOUNDARY_ARN" \
              ContentfulSpaceId="$CONTENTFUL_SPACE_ID" \
              "${hosting_parameters[@]}" \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

      - name: Validate existing canonical www redirects
        if: inputs.rollback_to_netlify == false
        timeout-minutes: 10
        run: scripts/validate-canonical-redirects.sh "$AMPLIFY_APP_ID" "$GITHUB_RUN_ID" --skip-unavailable

      - name: Apply DNS stack without changing delegation
        if: inputs.apply_domain == false
        run: |
          source scripts/cloudformation-stack-state.sh
          settle_stack sarabeth-amplify-dns
          parameter_overrides=()
          if [[ "${{ inputs.rollback_to_netlify }}" == "true" ]]; then
            parameter_overrides=(--parameter-overrides WebTarget=Netlify)
          fi
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-dns \
            --template-file infrastructure/cloudformation/dns.yaml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            "${parameter_overrides[@]}" \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

      - name: Remove Amplify domain association after DNS rollback
        if: inputs.rollback_to_netlify
        run: |
          source scripts/cloudformation-stack-state.sh
          settle_stack sarabeth-amplify-domain
          stack_status=$(get_stack_status sarabeth-amplify-domain)
          if [[ "$stack_status" == "ROLLBACK_COMPLETE" ]]; then
            aws cloudformation update-termination-protection \
              --no-enable-termination-protection \
              --stack-name sarabeth-amplify-domain
            aws cloudformation delete-stack --stack-name sarabeth-amplify-domain
            aws cloudformation wait stack-delete-complete --stack-name sarabeth-amplify-domain
          elif [[ "$stack_status" != "NOT_FOUND" ]]; then
            aws cloudformation deploy \
              --stack-name sarabeth-amplify-domain \
              --template-file infrastructure/cloudformation/domain.yaml \
              --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              --parameter-overrides \
                AmplifyAppId="$AMPLIFY_APP_ID" \
                AssociateDomain=false \
              --no-fail-on-empty-changeset \
              --tags Project=sarabeth-studio Environment=production
          fi

      - name: Preserve core stacks from accidental deletion
        if: inputs.operation != 'switch-monorepo'
        run: |
          for stack in sarabeth-amplify-hosting sarabeth-amplify-dns; do
            aws cloudformation update-termination-protection \
              --enable-termination-protection \
              --stack-name "$stack" >/dev/null
          done

      - name: Apply approval-gated domain association and DNS
        if: inputs.apply_domain
        id: domain_association
        continue-on-error: true
        timeout-minutes: 120
        run: |
          mapfile -t domain_parameters < "$RUNNER_TEMP/sarabeth-domain-parameters"
          if [[ "$MONOREPO_OPERATION" == switch-monorepo ]]; then
            python3 ../../scripts/release/sarabeth_transition.py guard
          fi
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-domain \
            --template-file infrastructure/cloudformation/domain.yaml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              AmplifyAppId="$AMPLIFY_APP_ID" \
              AssociateDomain=true \
              "${domain_parameters[@]}" \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

          domain=''
          for _ in {1..60}; do
            domain=$(aws amplify get-domain-association \
              --app-id "$AMPLIFY_APP_ID" \
              --domain-name sarabethbelon.com \
              --output json)
            domain_status=$(jq -r '.domainAssociation.domainStatus' <<< "$domain")
            if [[ "$domain_status" == "FAILED" ]]; then
              jq -r '.domainAssociation.statusReason' <<< "$domain" >&2
              exit 1
            fi
            certificate_record=$(jq -r '.domainAssociation.certificateVerificationDNSRecord // empty' <<< "$domain")
            cloudfront_target=$(jq -r '.domainAssociation.subDomains[0].dnsRecord | split(" ") | map(select(length > 0)) | last' <<< "$domain")
            if [[ -n "$certificate_record" && -n "$cloudfront_target" && "$cloudfront_target" != "<pending>" ]]; then
              break
            fi
            sleep 10
          done
          certificate_name=$(awk '{print $1}' <<< "$certificate_record")
          certificate_type=$(awk '{print $2}' <<< "$certificate_record")
          certificate_value=$(awk '{print $3}' <<< "$certificate_record")
          if [[ "$certificate_type" != "CNAME" || -z "$certificate_name" || -z "$certificate_value" || -z "$cloudfront_target" ]]; then
            echo "Amplify did not return complete domain DNS records" >&2
            exit 1
          fi

          if [[ "$MONOREPO_OPERATION" == switch-monorepo ]]; then
            python3 ../../scripts/release/sarabeth_transition.py guard
          fi
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-dns \
            --template-file infrastructure/cloudformation/dns.yaml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              WebTarget=Amplify \
              AmplifyCloudFrontTarget="$cloudfront_target" \
              AmplifyCertificateRecordName="$certificate_name" \
              AmplifyCertificateRecordValue="$certificate_value" \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

          for _ in {1..360}; do
            domain_status=$(aws amplify get-domain-association \
              --app-id "$AMPLIFY_APP_ID" \
              --domain-name sarabethbelon.com \
              --query 'domainAssociation.domainStatus' \
              --output text)
            if [[ "$domain_status" == "AVAILABLE" ]]; then
              if [[ "$MONOREPO_OPERATION" == switch-monorepo ]]; then
                python3 ../../scripts/release/sarabeth_transition.py domain
              fi
              exit 0
            fi
            if [[ "$domain_status" == "FAILED" ]]; then
              aws amplify get-domain-association \
                --app-id "$AMPLIFY_APP_ID" \
                --domain-name sarabethbelon.com \
                --query 'domainAssociation.statusReason' \
                --output text >&2
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the Amplify domain to become available" >&2
          exit 1

      - name: Validate canonical www redirects after activation
        if: inputs.apply_domain && steps.domain_association.outcome == 'success'
        id: canonical_redirects
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/validate-canonical-redirects.sh "$AMPLIFY_APP_ID" "$GITHUB_RUN_ID"

      - name: Accept monorepo production before CMS retarget
        if: inputs.operation == 'switch-monorepo' && steps.domain_association.outcome == 'success' && steps.canonical_redirects.outcome == 'success'
        run: python3 ../../scripts/release/sarabeth_transition.py accept

      - name: Apply separately approved webhook target after production acceptance
        if: inputs.operation == 'switch-monorepo' && inputs.retarget_webhook && steps.domain_association.outcome == 'success' && steps.canonical_redirects.outcome == 'success'
        timeout-minutes: 30
        run: |
          python3 ../../scripts/release/sarabeth_transition.py guard lkg-written
          mapfile -t hosting_parameters < "$RUNNER_TEMP/sarabeth-hosting-parameters"
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-hosting \
            --template-file infrastructure/cloudformation/hosting.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides \
              GitHubOidcProviderArn="$OIDC_PROVIDER_ARN" \
              WorkloadPermissionsBoundaryArn="$WORKLOAD_PERMISSIONS_BOUNDARY_ARN" \
              ContentfulSpaceId="$CONTENTFUL_SPACE_ID" \
              "${hosting_parameters[@]}" \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

      - name: Finish accepted monorepo switch without discarding previous recovery
        if: inputs.operation == 'switch-monorepo' && steps.domain_association.outcome == 'success' && steps.canonical_redirects.outcome == 'success'
        run: python3 ../../scripts/release/sarabeth_transition.py finish

      - name: Fail unresolved monorepo switch without blind rollback
        if: inputs.operation == 'switch-monorepo' && (failure() || steps.domain_association.outcome == 'failure' || steps.canonical_redirects.outcome == 'failure')
        run: |
          echo 'Switch failed or ambiguous. Preserve intent, previous recovery and actual SSM/job/domain state; reconcile before any retry or rollback.' >&2
          exit 1

      - name: Restore Netlify records after domain failure
        if: inputs.operation == 'legacy' && inputs.apply_domain && (steps.domain_association.outcome == 'failure' || steps.canonical_redirects.outcome == 'failure')
        timeout-minutes: 15
        run: |
          source scripts/cloudformation-stack-state.sh
          settle_stack sarabeth-amplify-dns
          aws cloudformation deploy \
            --stack-name sarabeth-amplify-dns \
            --template-file infrastructure/cloudformation/dns.yaml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --parameter-overrides WebTarget=Netlify \
            --no-fail-on-empty-changeset \
            --tags Project=sarabeth-studio Environment=production

      - name: Remove failed domain association after DNS rollback
        if: inputs.operation == 'legacy' && inputs.apply_domain && (steps.domain_association.outcome == 'failure' || steps.canonical_redirects.outcome == 'failure')
        id: domain_cleanup
        continue-on-error: true
        timeout-minutes: 20
        run: |
          source scripts/cloudformation-stack-state.sh
          settle_stack sarabeth-amplify-domain
          stack_status=$(get_stack_status sarabeth-amplify-domain)
          if [[ "$stack_status" == "ROLLBACK_COMPLETE" ]]; then
            aws cloudformation update-termination-protection \
              --no-enable-termination-protection \
              --stack-name sarabeth-amplify-domain
            aws cloudformation delete-stack --stack-name sarabeth-amplify-domain
            aws cloudformation wait stack-delete-complete --stack-name sarabeth-amplify-domain
          elif [[ "$stack_status" != "NOT_FOUND" ]]; then
            aws cloudformation deploy \
              --stack-name sarabeth-amplify-domain \
              --template-file infrastructure/cloudformation/domain.yaml \
              --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
              --parameter-overrides \
                AmplifyAppId="$AMPLIFY_APP_ID" \
                AssociateDomain=false \
              --no-fail-on-empty-changeset \
              --tags Project=sarabeth-studio Environment=production
          fi

      - name: Preserve domain stack from accidental deletion
        if: inputs.operation != 'switch-monorepo' && (inputs.apply_domain || inputs.rollback_to_netlify) && steps.domain_cleanup.outcome != 'failure'
        run: |
          source scripts/cloudformation-stack-state.sh
          stack_status=$(get_stack_status sarabeth-amplify-domain)
          if [[ "$stack_status" != "NOT_FOUND" ]]; then
            aws cloudformation update-termination-protection \
              --enable-termination-protection \
              --stack-name sarabeth-amplify-domain >/dev/null
          fi

      - name: Fail after domain rollback
        if: inputs.operation == 'legacy' && inputs.apply_domain && (steps.domain_association.outcome == 'failure' || steps.canonical_redirects.outcome == 'failure')
        run: |
          echo "Domain activation validation failed; Netlify web records were restored" >&2
          exit 1

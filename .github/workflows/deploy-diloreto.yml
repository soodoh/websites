name: Deploy DiLoreto
on:
  push:
    branches: [main]
    paths:
      - apps/diloreto/**
      - .github/actions/ci-tools/**
      - .github/workflows/deploy-diloreto.yml
      - scripts/deploy/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .nvmrc
      - .bun-version
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diloreto-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - run: bun run verify:diloreto
      - name: Package static site
        run: |
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{commit: $commit, runId: $runId, runAttempt: $runAttempt}' \
            > apps/diloreto/dist/client/__deployment.json
          cd apps/diloreto/dist/client
          zip -q -r "$RUNNER_TEMP/site.zip" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diloreto-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site.zip
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-diloreto
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: diloreto-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Deploy static artifact
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: scripts/deploy/amplify-static.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" release/site.zip
      - name: Verify native Amplify hosting
        env:
          HOSTING_BASE_URL: ${{ vars.PRODUCTION_URL }}
          HOSTING_EXPECT_AMPLIFY: "1"
          HOSTING_EXPECT_COMMIT: ${{ github.sha }}
          HOSTING_EXPECT_DOMAIN_REDIRECTS: "1"
        run: node apps/diloreto/scripts/hosting-smoke.mjs

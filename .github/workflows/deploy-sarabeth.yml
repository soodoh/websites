name: Deploy Sarabeth
run-name: Deploy Sarabeth (${{ inputs.source || github.event_name }})
on:
  push:
    branches: [main]
    paths:
      - apps/sarabeth/**
      - amplify.yml
      - .github/actions/ci-tools/**
      - .github/workflows/deploy-sarabeth.yml
      - scripts/deploy/**
      - package.json
      - bun.lock
      - bunfig.toml
      - turbo.json
      - .nvmrc
      - .bun-version
  workflow_dispatch:
    inputs:
      source:
        description: Deployment trigger
        required: false
        default: manual
        type: string
permissions:
  contents: read
concurrency:
  group: sarabeth-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/_sarabeth-ci.yml
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment:
      name: production-sarabeth
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Start and wait for repository-connected release
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: scripts/deploy/amplify-release.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Verify deployed commit
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: scripts/deploy/verify-release.sh "$PRODUCTION_URL" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          curl --fail --silent --show-error --location --output /dev/null "$PRODUCTION_URL"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PRODUCTION_URL%/}/api/email")" = 405

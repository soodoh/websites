name: Deploy Paul
on:
  push:
    branches: [main]
    paths:
      - apps/paul/**
      # PR CI still verifies docs, tests, and infrastructure changes.
      - "!apps/paul/docs/**"
      - "!apps/paul/infra/**"
      - "!apps/paul/tests/**"
      - "!apps/paul/*.md"
      - "!apps/paul/**/*.test.ts"
      - "!apps/paul/**/*.test.tsx"
      - "!apps/paul/**/*.spec.ts"
      - "!apps/paul/**/*.spec.tsx"
      - "!apps/paul/Dockerfile.playwright"
      - "!apps/paul/compose.playwright.yaml"
      - "!apps/paul/playwright*.config.ts"
      - "!apps/paul/lighthouse.json"
      - .github/actions/ci-tools/**
      - .github/workflows/deploy-paul.yml
      - scripts/deploy/amplify-static.sh
      - scripts/deploy/wait-for-amplify-job.sh
      - package.json
      - bun.lock
      - packages/images/**
      - "!packages/images/tests/**"
      - "!packages/images/**/*.test.ts"
      - "!packages/images/*.md"
      - bunfig.toml
      - turbo.json
      - .nvmrc
      - .bun-version
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-production
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/_site-ci.yml
    with:
      site: paul
      package-static: true
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: production-portfolio
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: paul-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Deploy static artifact
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_BRANCH }}
        run: scripts/deploy/amplify-static.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" release/site.zip
      - name: Verify native Amplify hosting
        env:
          HOSTING_BASE_URL: ${{ vars.PRODUCTION_URL }}
          HOSTING_EXPECT_AMPLIFY: "1"
          HOSTING_EXPECT_COMMIT: ${{ github.sha }}
          HOSTING_EXPECT_DOMAIN_REDIRECTS: "1"
        run: node apps/paul/scripts/hosting-smoke.mjs

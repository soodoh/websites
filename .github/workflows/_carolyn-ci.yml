name: carolyn CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: carolyn fixture verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CI: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      CI_RELEASE_METADATA: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-tools
      - name: Sequential canonical carolyn verification
        working-directory: ${{ github.workspace }}
        run: bun run verify:carolyn
      - name: Scan allowlisted fixture diagnostics
        if: always()
        id: diagnostics
        run: python3 scripts/ci/artifact.py diagnostics carolyn
      - name: Upload scanned diagnostics only
        if: always() && steps.diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: carolyn-${{ github.run_id }}-${{ github.run_attempt }}-fixture-diagnostics
          path: ci-artifacts/carolyn/diagnostics/
          retention-days: 14
          if-no-files-found: error

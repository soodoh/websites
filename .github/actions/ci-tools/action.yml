name: Pinned offline CI tools
description: Root-only frozen installation; no cloud credentials or caches
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.1
        cache: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.14.6'
    - name: Install exact tools and workspace
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        test "$(bun --version)" = 1.4.0
        test "$(node --version)" = v24.20.0
        python -m pip install uv==0.12.9 shellcheck-py==0.11.0.1
        shellcheck --version | grep -Fx 'version: 0.11.0'
        bun install --frozen-lockfile

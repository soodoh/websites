AWSTemplateFormatVersion: "2010-09-09"
Description: Shared GitHub OIDC, operational notifications, and monthly budget for one websites AWS account.

Parameters:
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:[^:]+:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"
    Description: Existing account-level GitHub Actions OIDC provider ARN. Leave empty only when this stack should create it.
  NotificationEmail:
    Type: String
    Description: Email address for production alarm and budget notifications.
  MonthlyBudgetAmount:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Account-wide monthly budget in USD.
  ResourceNamePrefix:
    Type: String
    Default: websites-production
    AllowedPattern: "^[A-Za-z0-9_-]+$"

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: websites
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  OperationalAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ResourceNamePrefix}-alarms
      DisplayName: Websites production alarms
      Tags:
        - Key: Project
          Value: websites
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  OperationalAlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OperationalAlarmTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  MonthlyAccountBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: !Ref MonthlyBudgetAmount
          Unit: USD
        BudgetName: !Sub ${ResourceNamePrefix}-account-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref NotificationEmail
              SubscriptionType: EMAIL

Outputs:
  GitHubOidcProviderArn:
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
  OperationalAlarmTopicArn:
    Value: !Ref OperationalAlarmTopic

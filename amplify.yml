version: 1
applications:
  - appRoot: apps/carolyn
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24.21.0
            - nvm use 24.21.0
            - npm install --global bun@1.4.2
            - bun install --frozen-lockfile --ignore-scripts
        build:
          commands:
            - |
              export CONTENTFUL_ACCESS_TOKEN="$(aws ssm get-parameter --name /carolyn-portfolio/prod/contentful-access-token --with-decryption --query Parameter.Value --output text)"
              cd apps/carolyn
              RELEASE_COMMIT="$AWS_COMMIT_ID" AMPLIFY_ARTIFACT_MODE=production bun run build
              RELEASE_COMMIT="$AWS_COMMIT_ID" AMPLIFY_ARTIFACT_MODE=production VERIFY_DEPLOYMENT_SECRETS=true bun run verify:prerender
      artifacts:
        baseDirectory: apps/carolyn/.amplify-hosting
        files: ["**/*"]
  - appRoot: apps/sarabeth
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 24.21.0
            - nvm use 24.21.0
            - npm install --global bun@1.4.2
            - bun install --frozen-lockfile --ignore-scripts
        build:
          commands:
            - |
              export CONTENTFUL_ACCESS_TOKEN="$(aws ssm get-parameter --name /sarabeth-studio/production/contentful/access-token --with-decryption --query Parameter.Value --output text)"
              cd apps/sarabeth
              RELEASE_COMMIT="$AWS_COMMIT_ID" NITRO_PRESET=aws-amplify bun run build
              RELEASE_COMMIT="$AWS_COMMIT_ID" bun run prepare:amplify
              RELEASE_COMMIT="$AWS_COMMIT_ID" bun run validate:amplify
      artifacts:
        baseDirectory: apps/sarabeth/.amplify-hosting
        files: ["**/*"]
